services:
  website:
    build:
      context: ./website
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose:
      - "3000"
    environment:
      PORT: "3000"
      TRUST_PROXY: "1"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: isidora_veris
      MYSQL_USER: isidora
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      ALLOWED_ORIGINS: https://isidoraverisugc.com,https://www.isidoraverisugc.com
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in Coolify}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in Coolify}
      EMAIL_FROM: ${EMAIL_FROM:-Isidora Veris <info@isidoraverisugc.com>}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-info@isidoraverisugc.com}
      LEGACY_MONGODB_URI: ${LEGACY_MONGODB_URI:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: ./api
    command: ["node", "./src/admin/index.mjs"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose:
      - "3000"
    environment:
      PORT: "3000"
      TRUST_PROXY: "1"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: isidora_veris
      MYSQL_USER: isidora
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-isidora}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MYSQLROOT}
      MYSQL_DATABASE: isidora_veris
      MYSQL_USER: isidora
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      TZ: Europe/Belgrade
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

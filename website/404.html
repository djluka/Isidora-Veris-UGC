<!doctype html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Stranica nije pronađena · Isidora Veriš</title>
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <style>
        @font-face{font-family:Seasons;src:url('/fonts/Fontspring-DEMO-theseasons-reg.otf') format('opentype');font-display:swap}
        @font-face{font-family:Cormorant;src:url('/fonts/CormorantGaramond-Regular.ttf') format('truetype');font-display:swap}
        :root{color:#3a2a18;background:#f4ebdf;font-family:Cormorant,Georgia,serif}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;overflow:hidden}
        body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.5;z-index:-1}
        body::before{width:28rem;height:28rem;background:#d5bdae;top:-12rem;right:-8rem}
        body::after{width:22rem;height:22rem;background:#c9c7b8;bottom:-10rem;left:-8rem}
        main{width:min(42rem,100%);text-align:center;padding:clamp(2rem,7vw,5rem);background:#fffaf4cc;border:1px solid #d5bdae;border-radius:2rem;box-shadow:0 1.5rem 4rem #3a2a181a;backdrop-filter:blur(12px)}
        .code{font-family:Seasons,Georgia,serif;font-size:clamp(6rem,24vw,11rem);line-height:.75;color:#7f7c70;letter-spacing:-.06em;margin:0}
        h1{font-family:Seasons,Georgia,serif;font-size:clamp(2rem,6vw,3.4rem);font-weight:400;margin:2rem 0 1rem}
        p{font-size:clamp(1.1rem,3vw,1.35rem);line-height:1.55;margin:0 auto 2rem;max-width:30rem;color:#655447}
        a{display:inline-flex;align-items:center;gap:.7rem;padding:.9rem 1.4rem;border-radius:999px;background:#3a2a18;color:#fff;text-decoration:none;font-family:system-ui,sans-serif;font-size:.9rem;letter-spacing:.04em;transition:transform .2s,background .2s}
        a:hover,a:focus-visible{background:#7f7c70;transform:translateY(-2px)}a:focus-visible{outline:3px solid #d5bdae;outline-offset:4px}
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>Ova stranica se izgubila.</h1>
        <p>Link možda više nije aktivan, ali sve što tražiš možeš pronaći na početnoj stranici.</p>
        <a href="/">Nazad na početnu <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>

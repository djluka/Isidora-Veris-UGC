version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-optimizer-backend
    ports:
      - "3001:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - video_uploads:/app/uploads
      - video_outputs:/app/outputs
    networks:
      - video-optimizer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-optimizer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - video-optimizer-network

networks:
  video-optimizer-network:
    driver: bridge

volumes:
  video_uploads:
  video_outputs:

version: '3.8'

services:
  # Video Optimizer Backend (Internal only - not exposed to internet)
  video-optimizer-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-optimizer-backend
    restart: unless-stopped
    ports:
      - "8602:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - video_uploads:/app/uploads
      - video_outputs:/app/outputs
    networks:
      default:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Video Optimizer Frontend (Exposed via Traefik)
  video-optimizer-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-optimizer-frontend
    restart: unless-stopped
    ports:
      - "8601:80"
    depends_on:
      - video-optimizer-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.VideoOptimizer.entrypoints=http"
      - "traefik.http.routers.VideoOptimizer.rule=Host(`video-optimizer.devbox.zone`)"
      - "traefik.http.middlewares.VideoOptimizer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.VideoOptimizer.middlewares=VideoOptimizer-https-redirect"
      - "traefik.http.routers.VideoOptimizer-secure.entrypoints=https"
      - "traefik.http.routers.VideoOptimizer-secure.rule=Host(`video-optimizer.devbox.zone`)"
      - "traefik.http.routers.VideoOptimizer-secure.tls=true"
      - "traefik.http.routers.VideoOptimizer-secure.tls.certresolver=http"
      - "traefik.http.routers.VideoOptimizer-secure.service=VideoOptimizer"
      - "traefik.http.services.VideoOptimizer.loadbalancer.server.port=80"
      - "traefik.docker.network=web"
      # Special handling for large video uploads
      - "traefik.http.middlewares.VideoOptimizer-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.VideoOptimizer-secure.middlewares=VideoOptimizer-headers"
    networks:
      - default
      - web

networks:
  web:
    external: true

volumes:
  video_uploads:
  video_outputs:
